[project]
name = "cp422-network-intrusion-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dash>=4.5.0",
    "dash-ag-grid>=35.3.0",
    "dash-bootstrap-components>=2.0.4",
    "dash-mantine-components>=3.0.0",
    "gradio>=6.32.0",
    "graphviz>=0.21",
    "lxml>=6.1.3",
    "matplotlib>=3.10.6,<3.11",
    "networkx>=3.7",
    "numpy>=2.3.4,<2.4",
    "pandas>=2.3.3,<3",
    "plotly>=7.1.0",
    "pyfunctional>=1.5.0",
    "scapy>=2.8.0",
    "shiny>=1.9.0",
    "streamlit>=1.67.0",
]

[dependency-groups]
local = [
    "databricks-connect>=19.1,<20",
]

[tool.uv]
default-groups = []

[tool.databricks.environment]
environment_version = '6'
